name: Deploy AISSC SUAD Manager Services to GCP

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: suad-claw-nexus-hybrid-01
  GAR_LOCATION: us-central1
  REPOSITORY: aissc-core-images
  IMAGE: suad-manager-base
  WORKLOAD_IDENTITY_PROVIDER: projects/284918491829/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  audit-and-security:
    name: Pre-Flight Audit & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run NPM Security Audit
        run: |
          if [ -f "package.json" ]; then
            npm audit --audit-level=high || echo "[WARN] High severity audit warnings detected."
          fi

  deploy:
    name: Build & Deploy Core SUAD Managers
    needs: audit-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud via OIDC Workload Identity
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Configure Docker for Google Artifact Registry (GAR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Compile, Tag, and Push Micro-Runtime Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}

      # Deploy Department 1: Sheryl (Chief Temporal Gateway)
      - name: Deploy Sheryl Gateway Service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: sheryl-gateway
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          region: ${{ env.GAR_LOCATION }}
          env_vars: |
            ACTIVE_AGENT_PROFILE=sheryl
            GCP_PROJECT_ID=${{ env.PROJECT_ID }}
            MEMORY_MOUNT_PATH=/gs/aissc-persistent-memory-store
          flags: |
            --min-instances=0
            --max-instances=5
            --concurrency=20
            --cpu=1
            --memory=2Gi
            --service-account=sheryl-gateway@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      # Deploy Department 2: Krieger (Systems & Tech Lead)
      - name: Deploy Krieger Tech Systems Service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: krieger-tech-systems
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          region: ${{ env.GAR_LOCATION }}
          env_vars: |
            ACTIVE_AGENT_PROFILE=krieger
            GCP_PROJECT_ID=${{ env.PROJECT_ID }}
            MEMORY_MOUNT_PATH=/gs/aissc-persistent-memory-store
          flags: |
            --min-instances=0
            --max-instances=5
            --concurrency=20
            --cpu=1
            --memory=2Gi
            --service-account=krieger-tech-systems@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      # Deploy Department 3: Pam (Workforce & Hybrid Dispatch)
      - name: Deploy Pam Workforce Service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: pam-workforce
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          region: ${{ env.GAR_LOCATION }}
          env_vars: |
            ACTIVE_AGENT_PROFILE=pam
            GCP_PROJECT_ID=${{ env.PROJECT_ID }}
            MEMORY_MOUNT_PATH=/gs/aissc-persistent-memory-store
          flags: |
            --min-instances=0
            --max-instances=5
            --concurrency=20
            --cpu=1
            --memory=2Gi
            --service-account=pam-workforce@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      # Deploy Department 4: Malory (Business Operations & Compliance)
      - name: Deploy Malory Business Ops Service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: malory-business-ops
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          region: ${{ env.GAR_LOCATION }}
          env_vars: |
            ACTIVE_AGENT_PROFILE=malory
            GCP_PROJECT_ID=${{ env.PROJECT_ID }}
            MEMORY_MOUNT_PATH=/gs/aissc-persistent-memory-store
          flags: |
            --min-instances=0
            --max-instances=5
            --concurrency=20
            --cpu=1
            --memory=2Gi
            --service-account=malory-business-ops@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
